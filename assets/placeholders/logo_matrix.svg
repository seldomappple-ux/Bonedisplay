  <text x="100" y="105" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">BONEDISPLAY</text>
  <text x="100" y="125" font-family="'JetBrains Mono', monospace" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="2">DIGITAL ZINE</text>
